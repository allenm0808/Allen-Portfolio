media:
  input: static/media
  output: /media

content:
  - name: site
    label: Site Settings
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: title
        label: Portfolio Title
        type: string
        required: true
      - name: linkedin_url
        label: LinkedIn URL
        type: string
        description: "Paste your full LinkedIn profile URL."
      - name: email
        label: Email Address
        type: string
      - name: background
        label: Background Color
        type: string
        description: "Hex color, e.g. #ffffff"
      - name: text_color
        label: Text Color
        type: string
        description: "Hex color, e.g. #000000"
      - name: highlight_color
        label: Link Hover Color
        type: string
        description: "Plain Jane default is #FE0100."

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename:
      template: "{title}.json"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, published, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: homepage_label
        label: Homepage Link Text
        type: string
        description: "Optional. Leave blank to use the Project Title automatically."
      - name: subtitle
        label: Subtitle
        type: string
      - name: published
        label: Show On Site
        type: boolean
        default: true
      - name: order
        label: Homepage Order
        type: number
        required: true
        description: "1 appears first, 2 second, etc."
      - name: summary
        label: Short Introduction
        type: text
      - name: sections
        label: Page Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section Heading
            type: string
          - name: body
            label: Section Text
            type: text
      - name: gallery
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Image Description
            type: string
      - name: external_link
        label: Project/File Link
        type: string
        description: "Optional link to a spreadsheet, PDF, Drive file, etc."
      - name: external_link_label
        label: Project/File Button Text
        type: string
        description: "Example: View Model or View Analysis."
