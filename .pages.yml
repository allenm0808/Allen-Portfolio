media:
  input: static/media
  output: /media

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: title
        label: Portfolio title
        type: string
        required: true
      - name: linkedin_url
        label: LinkedIn URL
        type: string
      - name: email
        label: Email address
        type: string
      - name: background
        label: Background color
        type: string
        description: "Hex color, e.g. #ffffff"
      - name: text_color
        label: Text color
        type: string
        description: "Hex color, e.g. #000000"
      - name: highlight_color
        label: Link hover color
        type: string
        description: "Plain Jane-style hover highlight."

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename:
      template: "{order}-{title}.json"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, published, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project page title
        type: string
        required: true
      - name: homepage_label
        label: Homepage link text
        type: string
        required: true
        description: "The short line shown in the center of the homepage."
      - name: subtitle
        label: Subtitle
        type: string
      - name: published
        label: Show on site
        type: boolean
        default: true
      - name: order
        label: Homepage order
        type: number
        required: true
        description: "1 appears first, 2 second, etc."
      - name: summary
        label: Short introduction
        type: text
      - name: sections
        label: Page sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section heading
            type: string
          - name: body
            label: Section text
            type: text
      - name: gallery
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Image description
            type: string
      - name: external_link
        label: Project/file link
        type: string
        description: "Optional link to a spreadsheet, PDF, Drive file, etc."
